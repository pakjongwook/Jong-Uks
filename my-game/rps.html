<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가위바위보!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #fff3b0;
    --bg-bottom: #ffd6e8;
    --cabinet: #ffffff;
    --outline: #3b2a5c;
    --title: #ff5fa2;
    --title-shadow: #ffc94d;
    --scissors: #7ed6ff;
    --rock: #ffb36b;
    --paper: #9ef0a8;
    --screen: #fffaf0;
    --dot: rgba(59, 42, 92, 0.08);
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--title-shadow); color: var(--outline); }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: "Jua", "Malgun Gothic", system-ui, sans-serif;
    color: var(--outline);
    background:
      radial-gradient(var(--dot) 2px, transparent 2px) 0 0 / 22px 22px,
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  }

  /* 처음으로 (자기소개 페이지) */
  .home-nav {
    width: 100%;
    max-width: 560px;
    margin-bottom: 14px;
  }
  .home {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 18px;
    font-size: 20px;
    color: var(--outline);
    text-decoration: none;
    background: var(--cabinet);
    border: 4px solid var(--outline);
    border-radius: 999px;
    box-shadow: 0 5px 0 var(--outline);
    transition: transform .1s, box-shadow .1s;
  }
  .home:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--outline); }
  .home:focus-visible { outline: 4px dashed var(--title); outline-offset: 4px; }

  .cabinet {
    position: relative;
    width: 100%;
    max-width: 560px;
    background: var(--cabinet);
    border: 5px solid var(--outline);
    border-radius: 32px;
    padding: 32px 24px 36px;
    text-align: center;
    box-shadow: 0 10px 0 var(--outline);
  }

  /* 오락실 전구 장식 */
  .lights {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .lights span {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 3px solid var(--outline);
    animation: blink 1.2s infinite;
  }
  .lights span:nth-child(3n+1) { background: var(--title); }
  .lights span:nth-child(3n+2) { background: var(--title-shadow); animation-delay: .4s; }
  .lights span:nth-child(3n)   { background: var(--scissors); animation-delay: .8s; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }

  h1 {
    margin: 0 0 28px;
    font-size: clamp(40px, 11vw, 64px);
    font-weight: 400;
    color: var(--title);
    letter-spacing: 2px;
    -webkit-text-stroke: 2px var(--outline);
    text-shadow: 4px 4px 0 var(--title-shadow), 7px 7px 0 var(--outline);
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  .choice {
    aspect-ratio: 1 / 1.1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 5px solid var(--outline);
    border-radius: 28px;
    font-family: inherit;
    color: var(--outline);
    cursor: pointer;
    box-shadow: 0 8px 0 var(--outline);
    transition: transform .1s, box-shadow .1s;
  }
  .choice .emoji { font-size: clamp(44px, 13vw, 72px); line-height: 1; }
  .choice .name { font-size: clamp(18px, 5vw, 24px); }
  .choice.scissors { background: var(--scissors); }
  .choice.rock     { background: var(--rock); }
  .choice.paper    { background: var(--paper); }
  /* 마우스가 있는 기기에서만 (폰에서 눌린 채로 남지 않게) */
  @media (hover: hover) {
    .choice:not(:disabled):hover { transform: translateY(-4px) rotate(-3deg); box-shadow: 0 12px 0 var(--outline); }
    .restart:hover { transform: translateY(-3px); box-shadow: 0 10px 0 var(--outline); }
    .home:hover { transform: translateY(-3px); box-shadow: 0 8px 0 var(--outline); background: var(--title-shadow); }
  }
  .choice:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--outline); }
  .choice:focus-visible { outline: 4px dashed var(--title); outline-offset: 4px; }

  /* 결과가 표시될 빈 화면 */
  .result {
    min-height: 140px;
    border: 5px solid var(--outline);
    border-radius: 22px;
    background:
      repeating-linear-gradient(0deg, transparent 0 6px, rgba(59, 42, 92, 0.04) 6px 7px),
      var(--screen);
    box-shadow: inset 0 4px 0 rgba(59, 42, 92, 0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 16px;
  }
  .result .label { font-size: 18px; opacity: .7; }
  .result .cpu {
    font-size: clamp(72px, 22vw, 110px);
    line-height: 1.1;
    animation: pop .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .result .message {
    font-size: clamp(26px, 8vw, 36px);
    padding: 4px 18px;
    border: 4px solid var(--outline);
    border-radius: 999px;
  }
  .result .message.win  { background: var(--title-shadow); }
  .result .message.lose { background: var(--scissors); }
  .result .message.draw { background: var(--paper); }
  .result .mine { font-size: 16px; opacity: .7; margin-top: 4px; }
  .result .talk {
    position: relative;
    max-width: 90%;
    margin-top: 12px;
    padding: 8px 16px;
    font-size: 19px;
    background: #fff;
    border: 4px solid var(--outline);
    border-radius: 16px;
    animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) .15s backwards;
  }
  .result .talk::before {
    content: "";
    position: absolute;
    top: -14px;
    left: 50%;
    margin-left: -10px;
    border: 10px solid transparent;
    border-top: 0;
    border-bottom: 12px solid var(--outline);
  }
  .result .talk.taunt { background: #ffe0ef; }
  .result .talk.sulk  { background: #e3f6ff; }
  @keyframes pop {
    0% { transform: scale(.2) rotate(-20deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* 점수판 */
  .scoreboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 auto 26px;
    padding: 10px 22px;
    width: fit-content;
    background: var(--outline);
    color: #fff;
    border-radius: 20px;
    font-size: clamp(22px, 6vw, 28px);
  }
  .scoreboard .num {
    font-size: clamp(40px, 12vw, 56px);
    line-height: 1;
    color: var(--title-shadow);
    font-variant-numeric: tabular-nums;
  }
  .scoreboard .num.bump { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  .scoreboard .colon { font-size: clamp(32px, 9vw, 44px); opacity: .6; }

  .choice:disabled { opacity: .5; cursor: default; transform: none; box-shadow: 0 8px 0 var(--outline); }

  /* 최종 승리 / 패배 */
  .final {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    border-radius: 27px;
    background: rgba(255, 250, 240, 0.94);
    animation: fadein .3s ease-out;
  }
  .final[hidden] { display: none; }
  .final .big-emoji { font-size: clamp(80px, 25vw, 130px); line-height: 1; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
  .final .title {
    font-size: clamp(40px, 12vw, 60px);
    -webkit-text-stroke: 2px var(--outline);
    text-shadow: 4px 4px 0 var(--outline);
  }
  .final.win .title  { color: var(--title-shadow); }
  .final.lose .title { color: var(--scissors); }
  .final .final-score { font-size: 24px; }
  .restart {
    margin-top: 8px;
    padding: 14px 34px;
    font-family: inherit;
    font-size: 26px;
    color: var(--outline);
    background: var(--title);
    border: 5px solid var(--outline);
    border-radius: 999px;
    box-shadow: 0 7px 0 var(--outline);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
  }
  .restart:focus-visible { outline: 4px dashed var(--outline); outline-offset: 4px; }
  .restart:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--outline); }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* 색종이 */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  /* 졌을 때 흔들림 */
  .cabinet.shake { animation: shake .5s cubic-bezier(.36, .07, .19, .97); }
  .cabinet.shake .result { animation: hit-flash .5s ease-out; }
  @keyframes shake {
    10%, 90% { transform: translateX(-3px) rotate(-.5deg); }
    20%, 80% { transform: translateX(6px) rotate(.8deg); }
    30%, 50%, 70% { transform: translateX(-10px) rotate(-1deg); }
    40%, 60% { transform: translateX(10px) rotate(1deg); }
  }
  @keyframes hit-flash {
    0% { background-color: #ffd0d8; }
    100% { background-color: var(--screen); }
  }

  /* 최종 승리 화면 */
  .final { overflow: hidden; }
  .final > * { position: relative; }
  .final .rays { display: none; }
  .final.win {
    background: radial-gradient(circle at 50% 38%, #fff8d6 0%, #ffe27a 45%, #ffb3d4 100%);
  }
  .final.win .rays {
    display: block;
    position: absolute;
    top: 38%;
    left: 50%;
    width: 900px;
    height: 900px;
    margin: -450px 0 0 -450px;
    background: repeating-conic-gradient(rgba(255, 255, 255, .55) 0deg 10deg, transparent 10deg 20deg);
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .final.win .big-emoji {
    animation: pop .6s cubic-bezier(.3, 1.6, .5, 1), trophy 1.6s ease-in-out .6s infinite;
    filter: drop-shadow(0 0 18px #fff) drop-shadow(0 6px 0 var(--outline));
  }
  @keyframes trophy {
    0%, 100% { transform: translateY(0) rotate(-6deg) scale(1); }
    50% { transform: translateY(-14px) rotate(6deg) scale(1.08); }
  }

  .final .title .letter { display: inline-block; }
  .final.win .title .letter { animation: wave 1.2s ease-in-out infinite; }
  @keyframes wave {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .final .badge { display: none; }
  .final.win .badge {
    display: block;
    padding: 6px 18px;
    font-size: 18px;
    letter-spacing: 6px;
    color: #fff;
    background: var(--outline);
    border-radius: 10px;
    animation: blink 1s steps(2) infinite;
  }

  .final .sparkle { display: none; }
  .final.win .sparkle {
    display: block;
    position: absolute;
    font-size: 30px;
    animation: twinkle 1.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { transform: scale(.4) rotate(0); opacity: .2; }
    50% { transform: scale(1.2) rotate(30deg); opacity: 1; }
  }

  .final.lose .big-emoji { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1), wobble 1.2s ease-in-out .5s infinite; }
  @keyframes wobble {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  /* 연승 표시 */
  .scoreboard { margin-bottom: 10px; }
  .streak-slot {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }
  .streak {
    padding: 4px 16px;
    font-size: 20px;
    background: var(--screen);
    border: 4px solid var(--outline);
    border-radius: 999px;
    animation: pop .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .streak[hidden] { display: none; }
  .streak.fire {
    color: #fff;
    background: linear-gradient(90deg, #ff3d3d, #ff8a1f, #ffc94d, #ff8a1f, #ff3d3d);
    background-size: 200% 100%;
    -webkit-text-stroke: 1px var(--outline);
    font-size: 22px;
    box-shadow: 0 4px 0 var(--outline);
    animation: pop .35s cubic-bezier(.3, 1.6, .5, 1), flame-bg 1.2s linear infinite;
  }
  @keyframes flame-bg { to { background-position: -200% 0; } }

  /* 🔥불붙었다! 팝업 */
  .fire-pop {
    position: absolute;
    left: 50%;
    top: 45%;
    z-index: 5;
    white-space: nowrap;
    pointer-events: none;
    font-size: clamp(40px, 12vw, 64px);
    color: #ff8a1f;
    -webkit-text-stroke: 2px var(--outline);
    text-shadow: 4px 4px 0 #ff3d3d, 7px 7px 0 var(--outline);
    animation: fire-pop 1.3s ease-out forwards;
  }
  @keyframes fire-pop {
    0%   { transform: translate(-50%, -50%) scale(.3) rotate(-12deg); opacity: 0; }
    20%  { transform: translate(-50%, -50%) scale(1.15) rotate(4deg); opacity: 1; }
    35%  { transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
    75%  { transform: translate(-50%, -70%) scale(1) rotate(-3deg); opacity: 1; }
    100% { transform: translate(-50%, -110%) scale(.9) rotate(-3deg); opacity: 0; }
  }

  /* 카운트다운 */
  .timer {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .start {
    padding: 8px 28px;
    font-family: inherit;
    font-size: 24px;
    color: var(--outline);
    background: var(--title-shadow);
    border: 4px solid var(--outline);
    border-radius: 999px;
    box-shadow: 0 6px 0 var(--outline);
    cursor: pointer;
    animation: bob 1.6s ease-in-out infinite;
  }
  .start:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--outline); }
  .start:focus-visible { outline: 4px dashed var(--title); outline-offset: 4px; }
  .start[hidden] { display: none; }
  .clock {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 380px;
  }
  .clock[hidden] { display: none; }
  .clock .sec {
    min-width: 72px;
    font-size: 40px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .clock .sec.bump { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  .clock.ready .sec { font-size: 26px; }
  .clock .bar {
    flex: 1;
    height: 24px;
    background: var(--screen);
    border: 4px solid var(--outline);
    border-radius: 999px;
    overflow: hidden;
  }
  .clock .fill {
    height: 100%;
    background: var(--paper);
    border-right: 3px solid var(--outline);
  }
  .clock.ready .fill { background: var(--scissors); }
  .clock.urgent .sec { color: #ff3d3d; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1), pulse .3s ease-in-out .35s infinite alternate; }
  .clock.urgent .fill { background: #ff6b6b; }
  @keyframes pulse { to { transform: scale(1.2); } }

  .result .message.timeout { background: #ff9b9b; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <nav class="home-nav">
    <a class="home" href="index.html">🏠 처음으로</a>
  </nav>

  <main class="cabinet">
    <div class="lights" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <h1>가위바위보!</h1>

    <div class="scoreboard" aria-live="polite">
      <span>나</span>
      <span class="num" id="playerScore">0</span>
      <span class="colon">:</span>
      <span class="num" id="cpuScore">0</span>
      <span>컴퓨터</span>
    </div>

    <div class="streak-slot" aria-live="polite">
      <div class="streak" id="streak" hidden></div>
    </div>

    <div class="timer">
      <button class="start" id="start">▶ 게임 시작!</button>
      <div class="clock" id="clock" hidden>
        <span class="sec" id="sec">3</span>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>
    </div>

    <div class="choices">
      <button class="choice scissors" data-choice="scissors">
        <span class="emoji">✌️</span><span class="name">가위</span>
      </button>
      <button class="choice rock" data-choice="rock">
        <span class="emoji">✊</span><span class="name">바위</span>
      </button>
      <button class="choice paper" data-choice="paper">
        <span class="emoji">✋</span><span class="name">보</span>
      </button>
    </div>

    <section class="result" id="result" aria-live="polite"></section>

    <div class="final" id="final" role="dialog" aria-modal="true" hidden>
      <div class="rays" aria-hidden="true"></div>
      <span class="sparkle" style="top: 8%; left: 10%;" aria-hidden="true">⭐</span>
      <span class="sparkle" style="top: 14%; right: 12%; animation-delay: .5s;" aria-hidden="true">✨</span>
      <span class="sparkle" style="bottom: 22%; left: 8%; animation-delay: .9s;" aria-hidden="true">✨</span>
      <span class="sparkle" style="bottom: 16%; right: 9%; animation-delay: .3s;" aria-hidden="true">⭐</span>
      <div class="badge">CHAMPION</div>
      <div class="big-emoji" id="finalEmoji"></div>
      <div class="title" id="finalTitle"></div>
      <div class="final-score" id="finalScore"></div>
      <button class="restart" id="restart">다시 하기 🔄</button>
    </div>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>

<script>
  const HANDS = {
    scissors: { emoji: "✌️", name: "가위", beats: "paper" },
    rock:     { emoji: "✊", name: "바위", beats: "scissors" },
    paper:    { emoji: "✋", name: "보",   beats: "rock" },
  };
  const MESSAGES = {
    win:  "이겼다! 🎉",
    lose: "졌다… 😭",
    draw: "비겼다 🤝",
    timeout: "시간 초과! 자동 패배 ⏰",
  };
  // 컴퓨터 대사: taunt = 컴퓨터가 이겼을 때(약올리기), sulk = 컴퓨터가 졌을 때(분해하기)
  const CPU_LINES = {
    taunt: [
      "메롱~ 😝 그것도 못 이겨?",
      "내 손이 더 빨랐지롱~ 🤪",
      "역시 난 천재 컴퓨터야! 😎",
      "삐빅! 승리 확률 100% 계산 완료 🤖",
      "다음엔 좀 더 열심히 해 봐~ 🥱",
      "너 혹시 내 생각 다 읽혔어? 히히 😏",
      "오늘 운이 없나 봐? 크크크 😆",
      "손가락 연습 좀 하고 와~ ✋✋",
      "이 정도면 내가 봐준 거야~ 😌",
      "울지 마, 울지 마~ 🍭 사탕 줄까?",
    ],
    sulk: [
      "으아아악! 이건 반칙이야!! 😤",
      "잠깐! 방금 건 연습 판이었어! 😡",
      "내 회로가 잠깐 버벅였을 뿐이야… 💢",
      "흥! 운이 좋았을 뿐이라고! 😾",
      "말도 안 돼… 내 계산이 틀리다니… 🤯",
      "한 판만 더 해! 이번엔 진짜다! 👊",
      "치사해… 내가 낼 거 미리 봤지? 🧐",
      "삐-빅- 오류 발생… 패배를 인정할 수 없음… 🤖💥",
      "다음 판은 각오해라… 😠🔥",
      "으앙 😭 엄마 서버한테 이를 거야!",
    ],
    // 시간 안에 안 냈을 때
    timeout: [
      "벌써 잠들었어? 😴 쿨쿨~",
      "3초가 그렇게 짧았어? ⏰ 크크",
      "생각하다 해 지겠다~ 🌇",
      "겁먹었구나? 그냥 내가 이긴 걸로~ 😏",
      "손이 얼었어? 🥶 녹여 줄까?",
      "부전승이다~ 공짜 점수 고마워! 🎁",
    ],
  };
  const lastLine = {};

  function pickLine(kind) {
    const lines = CPU_LINES[kind];
    let line;
    do {
      line = lines[Math.floor(Math.random() * lines.length)];
    } while (line === lastLine[kind]);
    lastLine[kind] = line;
    return line;
  }

  const WIN_SCORE = 3;
  const score = { player: 0, cpu: 0 };

  const resultEl = document.getElementById("result");
  const playerScoreEl = document.getElementById("playerScore");
  const cpuScoreEl = document.getElementById("cpuScore");
  const finalEl = document.getElementById("final");
  const choiceButtons = document.querySelectorAll(".choice");

  const cabinetEl = document.querySelector(".cabinet");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 색종이 애니메이션
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  const CONFETTI_COLORS = ["#ff5fa2", "#ffc94d", "#7ed6ff", "#ffb36b", "#9ef0a8", "#b892ff"];
  let pieces = [];
  let animating = false;

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function burst(x, y, count = 90, power = 14) {
    if (reduceMotion) return;
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1;
      const speed = power * (0.45 + Math.random() * 0.75);
      pieces.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 7 + Math.random() * 7,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        rot: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 0.4,
        round: Math.random() < 0.3,
        life: 1,
      });
    }
    if (!animating) {
      animating = true;
      requestAnimationFrame(drawConfetti);
    }
  }

  function drawConfetti() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    pieces = pieces.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    for (const p of pieces) {
      p.vy += 0.35;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.spin;
      p.life -= 0.006;

      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.round) {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 팔랑거리도록 세로 길이를 회전에 따라 변화
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, (p.size / 2) * Math.abs(Math.cos(p.rot * 2)) + 2);
      }
      ctx.restore();
    }
    if (pieces.length) {
      requestAnimationFrame(drawConfetti);
    } else {
      animating = false;
    }
  }

  function burstFrom(el, count, power) {
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, count, power);
  }

  function celebrate() {
    // 화면 양쪽 아래와 가운데에서 여러 번 터뜨리기
    const shots = [
      [0.15, 1, 0], [0.85, 1, 150], [0.5, 0.6, 350],
      [0.25, 1, 700], [0.75, 1, 850], [0.5, 0.5, 1150],
      [0.1, 1, 1500], [0.9, 1, 1600],
    ];
    shots.forEach(([fx, fy, delay]) => {
      setTimeout(() => burst(innerWidth * fx, innerHeight * fy, 110, 20), delay);
    });
  }

  function shake() {
    if (reduceMotion) return;
    cabinetEl.classList.remove("shake");
    void cabinetEl.offsetWidth;
    cabinetEl.classList.add("shake");
  }
  cabinetEl.addEventListener("animationend", (e) => {
    if (e.target === cabinetEl) cabinetEl.classList.remove("shake");
  });

  // 연승 기록 (다시 하기를 눌러도 이어짐, 지면 0으로)
  const FIRE_STREAK = 3;
  let streak = 0;
  const streakEl = document.getElementById("streak");

  function renderStreak() {
    if (streak === 0) {
      streakEl.hidden = true;
      return;
    }
    const onFire = streak >= FIRE_STREAK;
    streakEl.className = "streak" + (onFire ? " fire" : "");
    streakEl.textContent = onFire ? `🔥 ${streak}연승 중! 🔥` : `${streak}연승 중!`;
    streakEl.hidden = false;
    // 숫자가 바뀔 때마다 톡 튀도록 애니메이션 재시작
    streakEl.style.animation = "none";
    void streakEl.offsetWidth;
    streakEl.style.animation = "";
  }

  function firePop() {
    const pop = document.createElement("div");
    pop.className = "fire-pop";
    pop.setAttribute("aria-hidden", "true");
    pop.textContent = "🔥불붙었다!";
    cabinetEl.appendChild(pop);
    pop.addEventListener("animationend", () => pop.remove());
  }

  function bump(el, value) {
    el.textContent = value;
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  function showFinal(playerWon) {
    finalEl.className = "final " + (playerWon ? "win" : "lose");
    document.getElementById("finalEmoji").textContent = playerWon ? "🏆" : "👾";
    const titleEl = document.getElementById("finalTitle");
    const title = playerWon ? "최종 승리!" : "최종 패배…";
    titleEl.setAttribute("aria-label", title);
    titleEl.innerHTML = [...title]
      .map((ch, i) => `<span class="letter" aria-hidden="true" style="animation-delay: ${i * 0.1}s">${ch}</span>`)
      .join("");
    document.getElementById("finalScore").textContent = `나 ${score.player} : ${score.cpu} 컴퓨터`;
    finalEl.hidden = false;
    choiceButtons.forEach((b) => (b.disabled = true));
    document.getElementById("restart").focus();

    if (playerWon) celebrate();
    else shake();
  }

  // 카운트다운: 판마다 "준비!" 1초 뒤 3초 안에 내야 함
  const READY_MS = 1000;
  const COUNTDOWN_MS = 3000;
  const startBtn = document.getElementById("start");
  const clockEl = document.getElementById("clock");
  const secEl = document.getElementById("sec");
  const fillEl = document.getElementById("fill");
  let roundActive = false;
  let readyTimer = 0;
  let tickRaf = 0;
  let deadline = 0;
  let lastSec = 0;

  function setChoices(enabled) {
    choiceButtons.forEach((b) => (b.disabled = !enabled));
  }

  function stopTimer() {
    roundActive = false;
    clearTimeout(readyTimer);
    cancelAnimationFrame(tickRaf);
  }

  function showStart(text) {
    stopTimer();
    setChoices(false);
    clockEl.hidden = true;
    startBtn.textContent = text;
    startBtn.hidden = false;
  }

  function startRound() {
    stopTimer();
    roundActive = true;
    setChoices(false);
    startBtn.hidden = true;
    clockEl.hidden = false;
    clockEl.className = "clock ready";
    secEl.textContent = "준비!";
    fillEl.style.width = "100%";

    readyTimer = setTimeout(() => {
      deadline = performance.now() + COUNTDOWN_MS;
      lastSec = 0;
      clockEl.className = "clock";
      setChoices(true);
      tick();
    }, READY_MS);
  }

  function tick() {
    const remaining = deadline - performance.now();
    if (remaining <= 0) {
      timeUp();
      return;
    }
    const sec = Math.ceil(remaining / 1000);
    if (sec !== lastSec) {
      lastSec = sec;
      bump(secEl, sec);
      clockEl.classList.toggle("urgent", sec === 1);
    }
    fillEl.style.width = (remaining / COUNTDOWN_MS) * 100 + "%";
    tickRaf = requestAnimationFrame(tick);
  }

  function timeUp() {
    stopTimer();
    setChoices(false);
    secEl.textContent = "0";
    fillEl.style.width = "0%";
    showResult("시간 초과!", "⏰", "timeout", "내 선택: 없음 🙊", "timeout");
    settle("lose");
  }

  // 다른 탭으로 가면 판을 멈추고, 돌아와서 이어하기
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && roundActive) showStart("▶ 계속하기");
  });

  function restart() {
    score.player = score.cpu = 0;
    playerScoreEl.textContent = 0;
    cpuScoreEl.textContent = 0;
    resultEl.innerHTML = "";
    finalEl.hidden = true;
    startRound();
  }

  function judge(player, cpu) {
    if (player === cpu) return "draw";
    return HANDS[player].beats === cpu ? "win" : "lose";
  }

  function showResult(label, big, messageKind, mine, talkKind) {
    resultEl.innerHTML = `
      <div class="label">${label}</div>
      <div class="cpu">${big}</div>
      <div class="message ${messageKind}">${MESSAGES[messageKind]}</div>
      <div class="mine">${mine}</div>
    `;
    if (talkKind) {
      const talk = document.createElement("div");
      talk.className = "talk " + (talkKind === "sulk" ? "sulk" : "taunt");
      talk.textContent = "🤖 " + pickLine(talkKind);
      resultEl.appendChild(talk);
    }
  }

  function play(player) {
    if (!roundActive) return;
    stopTimer();
    setChoices(false);

    const keys = Object.keys(HANDS);
    const cpu = keys[Math.floor(Math.random() * keys.length)];
    const outcome = judge(player, cpu);
    const talkKind = { win: "sulk", lose: "taunt", draw: null }[outcome];

    showResult(
      "컴퓨터는…",
      HANDS[cpu].emoji,
      outcome,
      `내 선택: ${HANDS[player].emoji} ${HANDS[player].name}`,
      talkKind
    );
    settle(outcome);
  }

  // 점수·연승을 반영하고 최종 승부가 나지 않았으면 다음 판 시작
  function settle(outcome) {
    if (outcome === "win") {
      bump(playerScoreEl, ++score.player);
      burstFrom(resultEl.querySelector(".message"), 70, 13);
      streak++;
      if (streak >= FIRE_STREAK) firePop();
    }
    if (outcome === "lose") {
      bump(cpuScoreEl, ++score.cpu);
      shake();
      streak = 0;
    }
    if (outcome !== "draw") renderStreak();

    if (score.player >= WIN_SCORE || score.cpu >= WIN_SCORE) {
      clockEl.hidden = true;
      setTimeout(() => showFinal(score.player >= WIN_SCORE), 900);
    } else {
      startRound();
    }
  }

  choiceButtons.forEach((btn) => {
    btn.addEventListener("click", () => play(btn.dataset.choice));
  });
  startBtn.addEventListener("click", startRound);
  document.getElementById("restart").addEventListener("click", restart);
  showStart("▶ 게임 시작!");
</script>
</body>
</html>
